name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, lint, codegen, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK with its licenses accepted; AGP downloads any
      # platform or build-tools version it is missing.
      - uses: gradle/actions/setup-gradle@v6

      # buf-setup publishes no moving major tag, so this is pinned exactly. It resolves the
      # download URL through the GitHub API even for a pinned buf version, hence the token.
      - uses: bufbuild/buf-setup-action@v1.50.0
        with:
          version: 1.73.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: make ci

      - name: Check for uncommitted changes
        run: git diff --exit-code
