name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Format, lint, codegen, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The runner image ships the Android SDK with its licenses accepted; AGP downloads any
      # platform or build-tools version it is missing.
      - uses: gradle/actions/setup-gradle@v6

      # Robolectric downloads its Android runtime (about 210 MB) at test time, into ~/.m2 rather
      # than Gradle's cache; the runtime version follows the Robolectric version.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', 'pug/src/test/resources/robolectric.properties') }}

      - run: make ci

      - name: Check for uncommitted changes
        run: git diff --exit-code
