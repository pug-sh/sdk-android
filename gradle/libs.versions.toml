[versions]
agp = "9.4.1"
# The ABI dump library of the Kotlin Gradle plugin AGP builds with (tools/abi-dump).
abiTools = "2.2.10"
ktlint = "1.8.0"
detekt = "1.23.8"
# The R8 AGP builds with (tools/dead-code).
r8 = "9.4.28"
spotless = "8.10.4"
# Floors, not targets: Gradle resolves highest-wins, so these set the oldest versions a host app
# can be on. See PLAN.md D2/D3 before raising them.
coroutines = "1.9.0"
kotlinStdlib = "2.0.21"
junit = "4.13.2"
okhttp = "5.5.0"
orgJson = "20260814"
protobuf = "4.36.2"
robolectric = "4.17"

[libraries]
abi-tools = { module = "org.jetbrains.kotlin:abi-tools", version.ref = "abiTools" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlinStdlib" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
junit = { module = "junit:junit", version.ref = "junit" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
org-json = { module = "org.json:json", version.ref = "orgJson" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
r8 = { module = "com.android.tools:r8", version.ref = "r8" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
