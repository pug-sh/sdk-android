style:
  active: true
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
    # `named`: the `vararg named: NamedArguments` of the generated Pug.track methods, never passed or read.
    allowedNames: 'ignored|expected|named'
  UnusedPrivateClass:
    active: true
  UnusedPrivateMember:
    active: true
    allowedNames: ''
  UnusedPrivateProperty:
    active: true
    allowedNames: 'ignored|expected|serialVersionUID'
